<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Vendor List - INSOFT TECHNOLOGY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      color: #333;
      padding: 30px 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,.08);
      padding: 26px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 14px;
      flex-wrap: wrap;
    }
    .topbar h1 {
      margin: 0;
      color: #0056b3;
      font-size: 28px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }
    button:hover { opacity: 0.96; }
    .btn-primary {
      background: #0056b3;
      color: #fff;
    }
    .btn-secondary {
      background: #6c757d;
      color: #fff;
    }
    .btn-danger {
      background: #dc3545;
      color: #fff;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .toolbar .search-wrap {
      flex: 1 1 320px;
      display: flex;
      gap: 10px;
      min-width: 250px;
      flex-wrap: wrap;
    }
    .filter-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar input,
    .toolbar select,
    .modal input,
    .modal textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd8e3;
      border-radius: 6px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }
    .toolbar select {
      max-width: 220px;
    }
    .product-entry-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .product-entry-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 10px;
      align-items: end;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
    }
    .inline-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .inline-field label {
      font-size: 12px;
      font-weight: bold;
      color: #555;
    }
    .remove-product-row {
      height: 42px;
      min-width: 80px;
    }
    .summary {
      color: #4b5563;
      font-size: 14px;
      margin-bottom: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    th {
      background: #f8fafc;
      color: #1f2937;
      font-weight: bold;
    }
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      display: inline-block;
      background: #e9f2ff;
      color: #0056b3;
      border: 1px solid #cfe1ff;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
    }
    .empty-state {
      text-align: center;
      padding: 28px 14px;
      color: #4b5563;
      background: #f9fafb;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal {
      background: #fff;
      width: min(560px, 100%);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 24px;
      color: #0056b3;
    }
    .close-btn {
      border: none;
      background: transparent;
      color: #4b5563;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }
    .modal-body {
      padding: 20px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .field.full {
      grid-column: 1 / -1;
    }
    .field label {
      font-size: 12px;
      font-weight: bold;
      color: #555;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 20px 20px;
    }
    @media (max-width: 680px) {
      .form-grid { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar .search-wrap { width: 100%; }
      .topbar { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Vendor List</h1>
      <div class="actions">
        <button type="button" class="btn-primary" id="openVendorModal">+ Add Vendor</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <select id="productFilter" aria-label="Product category filter">
          <option value="">All Product Categories</option>
        </select>
        <select id="brandFilter" aria-label="Brand filter">
          <option value="">All Brands</option>
        </select>
        <input type="text" id="vendorNameSearch" placeholder="Vendor name" aria-label="Search by vendor name">
      </div>
      <div class="filter-actions">
        <button type="button" class="btn-secondary" id="clearFiltersBtn">Clear Filters</button>
      </div>
    </div>

    <div class="summary" id="resultsSummary">0 vendors</div>

    <table>
      <thead>
        <tr>
          <th style="width:22%;">Vendor Name</th>
          <th style="width:18%;">Phone No.</th>
          <th style="width:30%;">Address</th>
          <th style="width:22%;">Products / Categories</th>
          <th style="width:8%;">Action</th>
        </tr>
      </thead>
      <tbody id="vendorTableBody"></tbody>
    </table>
  </div>

  <div class="modal-backdrop" id="vendorModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vendorModalTitle">
      <div class="modal-header">
        <h2 id="vendorModalTitle">Add Vendor</h2>
        <button class="close-btn" type="button" id="closeVendorModal" aria-label="Close">×</button>
      </div>

      <form id="vendorForm">
        <div class="modal-body">
          <input type="hidden" id="vendorId">
          <div class="form-grid">
            <div class="field full">
              <label for="vendorName">Vendor Name</label>
              <input id="vendorName" name="vendorName" type="text" required>
            </div>

            <div class="field">
              <label for="vendorPhone">Phone No.</label>
              <input id="vendorPhone" name="vendorPhone" type="tel" required>
            </div>

            <div class="field">
              <label for="vendorAddress">Address</label>
              <input id="vendorAddress" name="vendorAddress" type="text" required>
            </div>

            <div class="field full">
              <label>Products / Categories</label>
              <div id="vendorProductsContainer" class="product-entry-block"></div>
              <button type="button" class="btn-secondary" id="addProductEntry">+ Add Category</button>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelVendorModal">Cancel</button>
          <button type="submit" class="btn-primary" id="vendorSubmitButton">Save Vendor</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const vendorModal = document.getElementById('vendorModal');
    const vendorForm = document.getElementById('vendorForm');
    const vendorTableBody = document.getElementById('vendorTableBody');
    const resultsSummary = document.getElementById('resultsSummary');
    const vendorNameSearch = document.getElementById('vendorNameSearch');
    const productFilter = document.getElementById('productFilter');
    const brandFilter = document.getElementById('brandFilter');
    const vendorIdField = document.getElementById('vendorId');
    const vendorModalTitle = document.getElementById('vendorModalTitle');
    const vendorSubmitButton = document.getElementById('vendorSubmitButton');
    const vendorProductsContainer = document.getElementById('vendorProductsContainer');

    function normalizeText(value) {
      return String(value || '').trim();
    }

    function parseProductEntry(value) {
      if (!value) return { product: '', brand: '' };
      if (typeof value === 'object') {
        return {
          product: normalizeText(value.product || value.category || value.name),
          brand: normalizeText(value.brand)
        };
      }

      const text = normalizeText(value);
      if (!text) return { product: '', brand: '' };

      if (text.includes('|')) {
        const [product, ...brandParts] = text.split('|');
        return {
          product: normalizeText(product),
          brand: normalizeText(brandParts.join('|'))
        };
      }

      return { product: text, brand: '' };
    }

    function stringifyProductEntry(product, brand) {
      const cleanProduct = normalizeText(product);
      const cleanBrand = normalizeText(brand);
      if (!cleanProduct && !cleanBrand) return '';
      return cleanBrand ? `${cleanProduct}|${cleanBrand}` : cleanProduct;
    }

    function buildProductEntryRow(product = '', brand = '') {
      const row = document.createElement('div');
      row.className = 'product-entry-row';
      row.innerHTML = `
        <div class="inline-field">
          <label>Product / Category</label>
          <input type="text" class="product-input" value="${escapeHtml(product)}" placeholder="e.g. HP Laptops" required>
        </div>
        <div class="inline-field">
          <label>Brand</label>
          <input type="text" class="brand-input" value="${escapeHtml(brand)}" placeholder="e.g. HP" required>
        </div>
        <button type="button" class="btn-danger remove-product-row">Remove</button>
      `;

      row.querySelector('.remove-product-row').addEventListener('click', () => {
        if (vendorProductsContainer.querySelectorAll('.product-entry-row').length > 1) {
          row.remove();
        } else {
          row.querySelector('.product-input').value = '';
          row.querySelector('.brand-input').value = '';
        }
      });

      return row;
    }

    function addProductEntry(product = '', brand = '') {
      vendorProductsContainer.appendChild(buildProductEntryRow(product, brand));
    }

    function populateProductBrandFilters(vendors) {
      const selectedProduct = productFilter.value;
      const selectedBrand = brandFilter.value;
      const products = new Set();
      const brands = new Set();

      vendors.forEach(vendor => {
        (vendor.products || []).forEach((entry) => {
          const { product, brand } = parseProductEntry(entry);
          if (product) products.add(product);
          if (brand) brands.add(brand);
        });
      });

      const previousProduct = selectedProduct && [...products].includes(selectedProduct) ? selectedProduct : '';
      const previousBrand = selectedBrand && [...brands].includes(selectedBrand) ? selectedBrand : '';

      productFilter.innerHTML = '<option value="">All Product Categories</option>' + [...products].sort().map(product => `<option value="${escapeHtml(product)}">${escapeHtml(product)}</option>`).join('');

      const filteredBrands = previousProduct
        ? [...new Set(vendors.flatMap(vendor => (vendor.products || []).map(parseProductEntry).filter(entry => entry.product === previousProduct).map(entry => entry.brand).filter(Boolean)))].sort()
        : [...brands].sort();

      brandFilter.innerHTML = '<option value="">All Brands</option>' + filteredBrands.map(brand => `<option value="${escapeHtml(brand)}">${escapeHtml(brand)}</option>`).join('');

      productFilter.value = previousProduct || '';
      brandFilter.value = previousBrand && filteredBrands.includes(previousBrand) ? previousBrand : '';
    }

    async function loadAllVendorOptions() {
      const response = await fetch(`${API_BASE}/api/vendors?q=&field=products`);
      if (!response.ok) {
        throw new Error('Unable to load category list.');
      }
      const vendors = await response.json();
      populateProductBrandFilters(vendors);
    }

    function getSearchQuery() {
      const product = normalizeText(productFilter.value);
      const brand = normalizeText(brandFilter.value);
      const name = normalizeText(vendorNameSearch.value);

      if (name && !product && !brand) {
        return { q: name, field: 'name' };
      }

      if (product && brand) {
        return { q: `${product}|${brand}`, field: 'products' };
      }

      if (product) {
        return { q: product, field: 'products' };
      }

      if (brand) {
        return { q: brand, field: 'brand' };
      }

      return { q: '', field: 'products' };
    }

    async function fetchVendors() {
      const { q, field } = getSearchQuery();
      const params = new URLSearchParams({ q, field });
      const response = await fetch(`${API_BASE}/api/vendors?${params.toString()}`);
      if (!response.ok) {
        throw new Error('Unable to load vendors.');
      }

      return response.json();
    }

    function renderVendors(list) {
      resultsSummary.textContent = `${list.length} vendor${list.length === 1 ? '' : 's'}`;

      if (!list.length) {
        vendorTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">No vendors match your search. Try a different product, brand, or vendor name.</td>
          </tr>
        `;
        return;
      }

      vendorTableBody.innerHTML = list.map(vendor => `
        <tr>
          <td>${escapeHtml(vendor.name)}</td>
          <td>${escapeHtml(vendor.phone)}</td>
          <td>${escapeHtml(vendor.address)}</td>
          <td>
            <div class="chip-group">
              ${(vendor.products || []).map(entry => {
                const { product, brand } = parseProductEntry(entry);
                const text = product && brand ? `${product} | ${brand}` : product || brand;
                return `<span class="chip">${escapeHtml(text)}</span>`;
              }).join('')}
            </div>
          </td>
          <td>
            <div class="actions" style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn-secondary" type="button" data-edit-id="${vendor.id}">Edit</button>
              <button class="btn-danger" type="button" data-delete-id="${vendor.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      document.querySelectorAll('[data-edit-id]').forEach(button => {
        button.addEventListener('click', async () => {
          const vendor = (await fetchVendors()).find(item => String(item.id) === String(button.dataset.editId));
          if (!vendor) return;
          openEditVendorModal(vendor);
        });
      });

      document.querySelectorAll('[data-delete-id]').forEach(button => {
        button.addEventListener('click', async () => {
          const response = await fetch(`${API_BASE}/api/vendors/${button.dataset.deleteId}`, {
            method: 'DELETE'
          });

          if (response.ok) {
            await refreshVendors();
          }
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function refreshVendors() {
      const selectedProduct = productFilter.value;
      const selectedBrand = brandFilter.value;

      try {
        const vendors = await fetchVendors();
        renderVendors(vendors);
      } catch (error) {
        vendorTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">${escapeHtml(error.message || 'Unable to load vendors.')}</td>
          </tr>
        `;
      }

      try {
        const optionsResponse = await fetch(`${API_BASE}/api/vendors?q=&field=products`);
        if (optionsResponse.ok) {
          const vendors = await optionsResponse.json();
          populateProductBrandFilters(vendors);
          if (selectedProduct) productFilter.value = selectedProduct;
          if (selectedBrand) brandFilter.value = selectedBrand;
        }
      } catch (error) {
        // keep current dropdown if all-data fetch fails
      }
    }

    function openAddVendorModal() {
      vendorIdField.value = '';
      vendorModalTitle.textContent = 'Add Vendor';
      vendorSubmitButton.textContent = 'Save Vendor';
      vendorForm.reset();
      vendorProductsContainer.innerHTML = '';
      addProductEntry();
      vendorModal.classList.add('show');
      vendorModal.setAttribute('aria-hidden', 'false');
      document.getElementById('vendorName').focus();
    }

    function openEditVendorModal(vendor) {
      vendorIdField.value = vendor.id;
      vendorModalTitle.textContent = 'Edit Vendor';
      vendorSubmitButton.textContent = 'Update Vendor';
      document.getElementById('vendorName').value = vendor.name || '';
      document.getElementById('vendorPhone').value = vendor.phone || '';
      document.getElementById('vendorAddress').value = vendor.address || '';
      vendorProductsContainer.innerHTML = '';
      const entries = (vendor.products || []).map(parseProductEntry);
      if (!entries.length) {
        addProductEntry();
      } else {
        entries.forEach(({ product, brand }) => addProductEntry(product, brand));
      }
      vendorModal.classList.add('show');
      vendorModal.setAttribute('aria-hidden', 'false');
      document.getElementById('vendorName').focus();
    }

    function closeVendorModal() {
      vendorModal.classList.remove('show');
      vendorModal.setAttribute('aria-hidden', 'true');
      vendorForm.reset();
      vendorProductsContainer.innerHTML = '';
      vendorIdField.value = '';
      vendorModalTitle.textContent = 'Add Vendor';
      vendorSubmitButton.textContent = 'Save Vendor';
    }

    document.getElementById('openVendorModal').addEventListener('click', openAddVendorModal);
    document.getElementById('closeVendorModal').addEventListener('click', closeVendorModal);
    document.getElementById('cancelVendorModal').addEventListener('click', closeVendorModal);
    document.getElementById('addProductEntry').addEventListener('click', () => addProductEntry());
    document.getElementById('clearFiltersBtn').addEventListener('click', () => {
      productFilter.value = '';
      brandFilter.value = '';
      vendorNameSearch.value = '';
      refreshVendors();
    });

    vendorModal.addEventListener('click', (event) => {
      if (event.target === vendorModal) closeVendorModal();
    });

    vendorForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const name = normalizeText(document.getElementById('vendorName').value);
      const phone = normalizeText(document.getElementById('vendorPhone').value);
      const address = normalizeText(document.getElementById('vendorAddress').value);
      const products = Array.from(vendorProductsContainer.querySelectorAll('.product-entry-row')).map((row) => {
        const product = normalizeText(row.querySelector('.product-input').value);
        const brand = normalizeText(row.querySelector('.brand-input').value);
        return { product, brand };
      }).filter((entry) => entry.product || entry.brand);

      if (!name || !phone || !address || products.length === 0) {
        alert('Please enter vendor name, phone no., address, and at least one product/brand pair.');
        return;
      }

      const invalidEntry = products.find((entry) => !entry.product || !entry.brand);
      if (invalidEntry) {
        alert('Each category must include both product/category and brand.');
        return;
      }

      const vendorId = vendorIdField.value;
      const method = vendorId ? 'PUT' : 'POST';
      const url = vendorId ? `${API_BASE}/api/vendors/${vendorId}` : `${API_BASE}/api/vendors`;

      const response = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, address, products })
      });

      const result = await response.json();
      if (!response.ok) {
        alert(result.error || 'Unable to save vendor.');
        return;
      }

      closeVendorModal();
      await refreshVendors();
    });

    productFilter.addEventListener('change', () => {
      if (productFilter.value === '') {
        brandFilter.value = '';
      } else {
        const selectedProduct = productFilter.value;
        const allOptions = Array.from(brandFilter.options).map(option => option.value);
        if (!allOptions.includes(brandFilter.value)) {
          brandFilter.value = '';
        }
      }
      refreshVendors();
    });

    brandFilter.addEventListener('change', refreshVendors);
    vendorNameSearch.addEventListener('input', refreshVendors);

    openAddVendorModal();
    closeVendorModal();
    loadAllVendorOptions().catch(() => {});
    refreshVendors();
  </script>
</body>
</html>
